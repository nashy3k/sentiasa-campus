[project]
name = "sentiasa-backend"
version = "0.1.0"
description = "Project SENTIASA - Deterministic Incident Triage State Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.12.0",
    "pydantic>=2.6.0",
    "tavily-python>=0.3.0",
    "typesafe-sdk>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "pytest>=8.0.0",
    "exa-py>=2.22.2",
    "opencv-python-headless>=5.0.0.93",
    "google-cloud-firestore>=2.33.0",
    "google-cloud-storage>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-p no:langsmith_plugin"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
